<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Never Gonna Give You Up</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Make the video fill the entire screen dynamically */
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 
      autoplay: Starts the video immediately
      loop: Repeats the video indefinitely
      muted: Required by browsers to allow autoplay
      playsinline: Prevents iOS from forcing full-screen native player
    -->
    <video autoplay loop muted playsinline id="rickroll">
        <source src="rickroll.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
